name: SatCam
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # get-task-allow is refused by sysextd on SIP-enabled systems
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
targets:
  SatCam:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.6"
        CFBundleVersion: "7"
        LSUIElement: true
        NSCameraUsageDescription: "SatCam captures the built-in camera to color-correct its feed."
    entitlements:
      path: App/SatCam.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.developer.system-extension.install: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plog.SatCam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SatCamExtension
        embed: true
  SatCamExtension:
    type: system-extension
    platform: macOS
    sources: [Extension]
    info:
      path: Extension/Info.plist
      properties:
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: "1.0.6"
        CFBundleVersion: "7"
        CMIOExtension:
          CMIOExtensionMachServiceName: "$(TeamIdentifierPrefix)net.plog.SatCam"
    entitlements:
      path: Extension/SatCamExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plog.SatCam.Extension
